[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jacobik"
version = "0.1.0"
description = "Statistical-potential inverse-kinematics generator of 3D structures for transition-metal complexes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4",
    "scipy>=1.17",
    "pandas>=3.0",
    "pyarrow>=25",
    "scikit-learn>=1.8",
    "joblib>=1.6",
    "networkx>=3.6",
    "rdkit>=2026.3",
    "torch>=2.13",
    "tqdm>=4.66",
]

[project.scripts]
jacobik = "jacobik:main"

[project.optional-dependencies]
vis = ["py3Dmol>=2.5", "matplotlib>=3.11", "ipywidgets>=8.1", "ipython>=8"]
# energy benchmark (MACE-POLAR-1-S re-ranking), pinned to the versions the passing test_benchmark_energy runs on
mace = ["mace-torch==0.3.17", "e3nn==0.4.4", "ase==3.29.0", "matscipy==1.3.1"]
dev = ["pytest>=9", "threadpoolctl>=3.5", "psutil>=7"]
notebooks = ["ipykernel>=7", "nbformat>=5.11", "nbconvert>=7.17"]

# The GFN2 embed refinement needs the external binary `xtb` (6.7.1 <= version < 7) on PATH or in JACOBIK_XTB.
# It is not installable from PyPI: `pixi install` / conda-forge provides it.

[tool.setuptools.packages.find]
where = ["src"]
include = ["jacobik*", "fit*"]

[tool.setuptools.package-data]
jacobik = ["data/*.json", "data/*.npz"]
fit = ["data/*.json"]

[tool.pytest.ini_options]
# the suite tests the source tree (conftest asserts it); dev/tools is the importable `tools` package
testpaths = ["dev/tests"]
pythonpath = ["src", "dev", "research/bench"]
