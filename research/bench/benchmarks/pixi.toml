[workspace]
name = "architector-benchmarks"
version = "0.1.0"
description = "Isolated, offline, non-tmQM coordination-complex benchmark"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.11.*"
numpy = ">=1.24,<2"
ase = ">=3.22,<3.24"
mendeleev = ">=0.12,<0.14"
pandas = ">=1.5,<3"
rdkit = ">=2023.3,<2025"
openbabel = ">=3.1,<4"

[feature.runtime]
platforms = ["linux-64"]

[feature.runtime.dependencies]
architector = "==0.0.10"

[environments]
default = ["runtime"]
audit = []

[tasks]
validate = "python scripts/validate.py --chemistry --include-challenge"
validate-challenge = "python scripts/validate_challenge.py --chemistry"
doctor = "python scripts/doctor.py"
smoke = "python scripts/run_architector.py --suite baseline --case S01 --seed 17 --n-conformers 1 --timeout 180"
references = "python scripts/prepare_references.py"
challenge-references = "python scripts/prepare_challenge_references.py"
